  <path d="M 194 205 C 194 130 318 130 318 205" stroke="url(#headphoneGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <rect x="186" y="194" width="16" height="34" rx="8" fill="url(#headphoneGrad)"/>
  <rect x="310" y="194" width="16" height="34" rx="8" fill="url(#headphoneGrad)"/>

  <!-- Bangs -->
  <path d="M 192 190 C 192 160 215 150 256 150 C 297 150 320 160 320 190 C 310 185 290 190 282 176 C 275 190 255 185 245 174 C 235 188 215 192 192 190 Z" fill="url(#hairGrad)"/>
  <path d="M 256 148 Q 262 130 274 135 Q 265 142 260 150 Z" fill="url(#hairGrad)"/>

  <!-- Blush -->
  <ellipse cx="225" cy="222" rx="11" ry="6" fill="#fb7185" opacity="0.45"/>
  <ellipse cx="287" cy="222" rx="11" ry="6" fill="#fb7185" opacity="0.45"/>

  <!-- Glasses -->
  <circle cx="230" cy="208" r="17" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
  <circle cx="282" cy="208" r="17" fill="none" stroke="#fbbf24" stroke-width="3.5"/>
  <line x1="247" y1="208" x2="265" y2="208" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Eyes & Mouth -->
  <path d="M 222 210 Q 230 204 238 210" stroke="#1c0d02" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 274 210 Q 282 204 290 210" stroke="#1c0d02" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M 251 228 Q 256 233 261 228" stroke="#1c0d02" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Arms & Hands -->
  <path d="M 200 320 C 190 350 215 372 238 368" stroke="#6366f1" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M 312 320 C 322 350 297 372 274 368" stroke="#6366f1" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="236" cy="366" r="11" fill="url(#skinGrad)"/>
  <circle cx="276" cy="366" r="11" fill="url(#skinGrad)"/>

  <!-- Open Notebook -->
  <path d="M 256 384 L 180 376 C 176 376 172 380 174 384 L 182 430 C 183 434 187 436 191 436 L 256 442 Z" fill="url(#bookGrad)"/>
  <path d="M 256 384 L 332 376 C 336 376 340 380 338 384 L 330 430 C 329 434 325 436 321 436 L 256 442 Z" fill="url(#bookGrad)"/>
  <line x1="256" y1="384" x2="256" y2="442" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Pencil -->
  <line x1="278" y1="364" x2="296" y2="340" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="274,369 278,363 280,366" fill="#1e293b"/>
  <circle cx="296" cy="340" r="3" fill="#f43f5e"/>
</svg>
