<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="lampCone" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0d02"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef9c3"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-opacity="0.3"/>
  <circle cx="256" cy="310" r="210" fill="url(#lampCone)"/>

  <rect x="56" y="372" width="400" height="90" rx="18" fill="url(#deskGrad)"/>
  <rect x="56" y="372" width="400" height="8" rx="4" fill="#92400e"/>

  <path d="M 120 120 Q 120 135 105 135 Q 120 135 120 150 Q 120 135 135 135 Q 120 135 120 120 Z" fill="#fbbf24" opacity="0.85"/>
  <path d="M 400 130 Q 400 142 388 142 Q 400 142 400 154 Q 400 142 412 142 Q 400 142 400 130 Z" fill="#fde047" opacity="0.8"/>

  <!-- Mini Lamp -->
  <path d="M 95 372 L 105 372 L 105 270 Q 105 240 135 235 L 145 234" stroke="#a1a1aa" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 130 220 L 165 240 L 140 260 Z" fill="#fbbf24"/>
  <ellipse cx="152" cy="250" rx="8" ry="14" fill="#fef08a"/>

  <!-- Mug -->
  <rect x="382" y="348" width="28" height="26" rx="6" fill="#f43f5e"/>
  <path d="M 410 354 Q 418 360 410 366" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 396 358 A 2 2 0 0 1 399 361 L 396 364 L 393 361 A 2 2 0 0 1 396 358 Z" fill="#ffffff"/>

